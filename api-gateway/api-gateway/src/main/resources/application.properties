server.port=8080
spring.application.name=api-gateway

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# =========================================
# SERVICE DISCOVERY
# =========================================

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

server.address=0.0.0.0

# =========================================
# GATEWAY ROUTES
# =========================================

# USER SERVICE
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/users/**

# PARKING SERVICE
spring.cloud.gateway.routes[1].id=parking-service
spring.cloud.gateway.routes[1].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/parking/**

# BOOKING SERVICE
spring.cloud.gateway.routes[2].id=booking-service
spring.cloud.gateway.routes[2].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/booking/**

# PAYMENT SERVICE
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/payment/**

# AUTH SERVICE
spring.cloud.gateway.routes[4].id=auth-service
spring.cloud.gateway.routes[4].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/auth/**

# NOTIFICATION SERVICE
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/notify/**

# EMAIL SERVICE
spring.cloud.gateway.routes[6].id=email-service
spring.cloud.gateway.routes[6].uri=lb://EMAIL-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/email/**

# =========================================
# SWAGGER ROUTES
# =========================================

# AUTH SWAGGER
spring.cloud.gateway.routes[7].id=auth-swagger
spring.cloud.gateway.routes[7].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/v3/api-docs/auth
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/v3/api-docs/auth,/v3/api-docs

# USER SWAGGER
spring.cloud.gateway.routes[8].id=user-swagger
spring.cloud.gateway.routes[8].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/v3/api-docs/user
spring.cloud.gateway.routes[8].filters[0]=RewritePath=/v3/api-docs/user,/v3/api-docs

# PARKING SWAGGER
spring.cloud.gateway.routes[9].id=parking-swagger
spring.cloud.gateway.routes[9].uri=lb://PARKING-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/v3/api-docs/parking
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/v3/api-docs/parking,/v3/api-docs

# BOOKING SWAGGER
spring.cloud.gateway.routes[10].id=booking-swagger
spring.cloud.gateway.routes[10].uri=lb://BOOKING-SERVICE
spring.cloud.gateway.routes[10].predicates[0]=Path=/v3/api-docs/booking
spring.cloud.gateway.routes[10].filters[0]=RewritePath=/v3/api-docs/booking,/v3/api-docs

# PAYMENT SWAGGER
spring.cloud.gateway.routes[11].id=payment-swagger
spring.cloud.gateway.routes[11].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[11].predicates[0]=Path=/v3/api-docs/payment
spring.cloud.gateway.routes[11].filters[0]=RewritePath=/v3/api-docs/payment,/v3/api-docs

# NOTIFICATION SWAGGER
spring.cloud.gateway.routes[12].id=notification-swagger
spring.cloud.gateway.routes[12].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[12].predicates[0]=Path=/v3/api-docs/notification
spring.cloud.gateway.routes[12].filters[0]=RewritePath=/v3/api-docs/notification,/v3/api-docs

# EMAIL SWAGGER
spring.cloud.gateway.routes[13].id=email-swagger
spring.cloud.gateway.routes[13].uri=lb://EMAIL-SERVICE
spring.cloud.gateway.routes[13].predicates[0]=Path=/v3/api-docs/email
spring.cloud.gateway.routes[13].filters[0]=RewritePath=/v3/api-docs/email,/v3/api-docs

# =========================================
# CORS
# =========================================

spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowCredentials=true

# =========================================
# SPRINGDOC
# =========================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ==============================
# SWAGGER API DOCS
# ==============================

springdoc.swagger-ui.path=/swagger-ui.html

springdoc.swagger-ui.urls[0].name=Auth Service
springdoc.swagger-ui.urls[0].url=/v3/api-docs/auth

springdoc.swagger-ui.urls[1].name=User Service
springdoc.swagger-ui.urls[1].url=/v3/api-docs/user

springdoc.swagger-ui.urls[2].name=Parking Service
springdoc.swagger-ui.urls[2].url=/v3/api-docs/parking

springdoc.swagger-ui.urls[3].name=Booking Service
springdoc.swagger-ui.urls[3].url=/v3/api-docs/booking

springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/v3/api-docs/payment

springdoc.swagger-ui.urls[5].name=Email Service
springdoc.swagger-ui.urls[5].url=/v3/api-docs/email

springdoc.swagger-ui.urls[6].name=Notification Service
springdoc.swagger-ui.urls[6].url=/v3/api-docs/notification